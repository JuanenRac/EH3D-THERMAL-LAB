[package]
name = "eh3d-thermal-lab"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Stage-1 thermal estimates: analytic calculations and simplified thermal networks whose every result states its hypotheses, conditions and limits"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-THERMAL-LAB"
readme = "README.md"

[lib]
name = "eh3d_thermal_lab"
path = "src/lib.rs"

[[bin]]
name = "eh3d-thermal-lab"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
